[pytest]
testpaths = tests
pythonpath = .
addopts =
    -v
    -m "not e2e"
    --cov=app
    --cov-branch
    --cov-report=term-missing
    --cov-report=html:reports/coverage-html
    --cov-report=xml:reports/coverage.xml
    --cov-fail-under=85
    --junitxml=reports/junit.xml
filterwarnings =
    ignore::DeprecationWarning:starlette.*
markers =
    caja_negra: particiones de equivalencia, valores límite y tabla de decisión
    caja_blanca: caminos independientes del grafo de flujo de control
    robustez: entradas atípicas y propiedades del desglose
    api: pruebas de los endpoints REST
    e2e: pruebas de extremo a extremo en navegador (pytest -m e2e --no-cov)
